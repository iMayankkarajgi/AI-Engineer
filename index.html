<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#f7f6fb" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#0c0a17" media="(prefers-color-scheme: dark)"/>
  <meta name="description" content="AI Atlas: see it, understand it, and build with it. A visual learning path from AI basics to production systems."/>
  <title>AI Atlas</title>
  <!-- Apply the saved (or system) theme before first paint to avoid a flash. -->
  <script>try{var d=document.documentElement.dataset.theme;var t=localStorage.getItem('atlas-theme');if(t!=='light'&&t!=='dark'&&(d==='light'||d==='dark'))t=d;if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet"/>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
